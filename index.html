<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Social</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

.card{
    width:320px;
    margin:100px auto;
    padding:20px;
    background:#1c1c1c;
    border-radius:15px;
}

input, button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
}

input{
    background:#2a2a2a;
    color:white;
}

button{
    background:#4b7cff;
    color:white;
    cursor:pointer;
}

#app{
    display:none;
    text-align:center;
}
</style>
</head>

<body>

<div class="card" id="auth">

<h2>Login / Register</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<div id="app">
<h2>Ты вошёл</h2>
<p id="user"></p>
<button onclick="logout()">Logout</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const supabase = supabase.createClient(
  'https://opqngkyrgazoggzscdqv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcW5na3lyZ2F6b2dnenNjZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTE2NjUsImV4cCI6MjA5NDQyNzY2NX0.ujjzvuhq1MxpDDLo8g5skjfa_vNunGU5d4EY402x7Fc'
)

async function register(){

  const email = document.getElementById('email').value
  const password = document.getElementById('password').value

  const { error } = await supabase.auth.signUp({
    email,
    password
  })

  if(error){
    alert(error.message)
  } else {
    alert('Регистрация успешна')
  }
}

async function login(){

  const email = document.getElementById('email').value
  const password = document.getElementById('password').value

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  })

  if(error){
    alert(error.message)
    return
  }

  document.getElementById('auth').style.display = 'none'
  document.getElementById('app').style.display = 'block'
  document.getElementById('user').innerText = data.user.email
}

async function logout(){
  await supabase.auth.signOut()
  location.reload()
}

</script>

</body>
</html>
