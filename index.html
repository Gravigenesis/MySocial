<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Social</title>

<style>
body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

.container{
    width:520px;
    margin:auto;
    padding-top:20px;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4b7cff;
    color:white;
    cursor:pointer;
}

.post{
    background:#222;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
    display:flex;
    gap:10px;
}

.avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#4b7cff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.chatBox{
    height:200px;
    overflow:auto;
    background:#111;
    padding:10px;
    border-radius:10px;
}

.msg{
    margin-bottom:8px;
    font-size:14px;
}

#app{display:none;}
</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div class="card" id="auth">

<h2>Mini Social</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<!-- APP -->
<div id="app">

<div class="card">
<h3 id="userEmail"></h3>

<textarea id="text" placeholder="Write post..."></textarea>
<button onclick="createPost()">Post</button>
</div>

<div class="card">
<h3>💬 Chat</h3>
<div class="chatBox" id="chat"></div>
<input id="chatInput" placeholder="Message...">
<button onclick="sendMessage()">Send</button>
</div>

<div id="posts"></div>

</div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
'https://opqngkyrgazoggzscdqv.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcW5na3lyZ2F6b2dnenNjZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTE2NjUsImV4cCI6MjA5NDQyNzY2NX0.ujjzvuhq1MxpDDLo8g5skjfa_vNunGU5d4EY402x7Fc'
)

let currentUser = null

// AVATAR
function avatar(email){
return email ? email[0].toUpperCase() : "?"
}

// REGISTER
window.register = async () => {
const { error } = await supabase.auth.signUp({
email: emailInput().email,
password: emailInput().password
})
if(error) return alert(error.message)
alert("Registered")
}

// LOGIN
window.login = async () => {
const { data, error } = await supabase.auth.signInWithPassword({
email: emailInput().email,
password: emailInput().password
})

if(error) return alert(error.message)

currentUser = data.user.email
showApp()
loadPosts()
loadChat()
}

// CREATE POST
window.createPost = async () => {

const text = document.getElementById("text").value

await supabase.from("posts").insert({
user_email: currentUser,
content: text
})

document.getElementById("text").value = ""
loadPosts()
}

// LIKE POST
window.likePost = async (id) => {

await supabase.from("likes").insert({
post_id: id,
user_email: currentUser
})

alert("Liked ❤️")
}

// LOAD POSTS
async function loadPosts(){

const { data } = await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false})

document.getElementById("posts").innerHTML = ""

data.forEach(post => {

const div = document.createElement("div")
div.className = "post"

div.innerHTML = `
<div class="avatar">${avatar(post.user_email)}</div>
<div>
<b>${post.user_email}</b>
<p>${post.content}</p>
<button onclick="likePost('${post.id}')">❤️ Like</button>
</div>
`

document.getElementById("posts").appendChild(div)

})

}

// CHAT
window.sendMessage = async () => {

const msg = document.getElementById("chatInput").value

await supabase.from("messages").insert({
user_email: currentUser,
message: msg
})

document.getElementById("chatInput").value = ""
loadChat()
}

async function loadChat(){

const { data } = await supabase
.from("messages")
.select("*")
.order("created_at",{ascending:true})

const chat = document.getElementById("chat")
chat.innerHTML = ""

data.forEach(m => {
chat.innerHTML += `
<div class="msg">
<b>${m.user_email}</b>: ${m.message}
</div>
`
})

chat.scrollTop = chat.scrollHeight
}

// SHOW APP
function showApp(){
document.getElementById("auth").style.display="none"
document.getElementById("app").style.display="block"
document.getElementById("userEmail").innerText=currentUser
}

// AUTH INPUT
function emailInput(){
return {
email: document.getElementById("email").value,
password: document.getElementById("password").value
}
}

// CHECK SESSION
async function checkUser(){
const { data } = await supabase.auth.getUser()

if(data.user){
currentUser = data.user.email
showApp()
loadPosts()
loadChat()
}
}

checkUser()

</script>

</body>
</html>
