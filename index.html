<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mini Instagram</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

.container{
    width:520px;
    margin:auto;
    padding-top:20px;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4b7cff;
    color:white;
    cursor:pointer;
}

.post{
    background:#222;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

.small{
    font-size:12px;
    color:#aaa;
}

#app{display:none;}

</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div class="card" id="auth">

<h2>Mini Instagram</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<!-- APP -->
<div id="app">

<div class="card">

<h3 id="userEmail"></h3>

<input type="file" id="image">

<textarea id="text" placeholder="Write post..."></textarea>

<button onclick="createPost()">Post</button>

<button onclick="logout()">Logout</button>

</div>

<div id="posts"></div>

</div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(

'https://opqngkyrgazoggzscdqv.supabase.co',

'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcW5na3lyZ2F6b2dnenNjZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTE2NjUsImV4cCI6MjA5NDQyNzY2NX0.ujjzvuhq1MxpDDLo8g5skjfa_vNunGU5d4EY402x7Fc'

)

let currentUser = null

// REGISTER
window.register = async () => {

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { error } = await supabase.auth.signUp({
email,
password
})

if(error) return alert(error.message)

alert("Registered")
}

// LOGIN
window.login = async () => {

const email = document.getElementById("email").value
const password = document.getElementById("password").value

const { data, error } =
await supabase.auth.signInWithPassword({ email, password })

if(error) return alert(error.message)

currentUser = data.user.email
showApp()
loadPosts()
}

// LOGOUT
window.logout = async () => {
await supabase.auth.signOut()
location.reload()
}

// CREATE POST + IMAGE
window.createPost = async () => {

const file = document.getElementById("image").files[0]
const text = document.getElementById("text").value

if(!file) return alert("Select image")

const fileName = Date.now() + file.name

await supabase.storage
.from("images")
.upload(fileName, file)

const { data } = supabase.storage
.from("images")
.getPublicUrl(fileName)

await supabase.from("posts").insert({
user_email: currentUser,
content: text,
image_url: data.publicUrl
})

document.getElementById("text").value = ""
loadPosts()
}

// LOAD POSTS
async function loadPosts(){

const { data } = await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false})

document.getElementById("posts").innerHTML = ""

data.forEach(post => {

const div = document.createElement("div")
div.className = "post"

div.innerHTML = `
<b>${post.user_email}</b>
<p>${post.content}</p>
<img src="${post.image_url}">

<button onclick="likePost('${post.id}')">❤️ Like</button>
<button onclick="commentPost('${post.id}')">💬 Comment</button>
`

document.getElementById("posts").appendChild(div)
})

}

// LIKE
window.likePost = async (id) => {
await supabase.from("likes").insert({
post_id: id,
user_email: currentUser
})
alert("Liked")
}

// COMMENT
window.commentPost = async (id) => {

const text = prompt("Write comment:")
if(!text) return

await supabase.from("comments").insert({
post_id: id,
user_email: currentUser,
content: text
})

alert("Comment added")
}

// SHOW APP
function showApp(){
document.getElementById("auth").style.display="none"
document.getElementById("app").style.display="block"
document.getElementById("userEmail").innerText=currentUser
}

// CHECK USER
async function checkUser(){

const { data } = await supabase.auth.getUser()

if(data.user){
currentUser = data.user.email
showApp()
loadPosts()
}
}

checkUser()

</script>

</body>
</html>
