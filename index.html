<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Instagram FIX</title>

<style>

body{
    margin:0;
    background:#0f0f0f;
    color:white;
    font-family:Arial;
}

.container{
    width:520px;
    margin:auto;
    padding-top:20px;
}

.card{
    background:#1c1c1c;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin-top:8px;
    border:none;
    border-radius:8px;
    background:#2a2a2a;
    color:white;
}

button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#4b7cff;
    color:white;
    cursor:pointer;
}

.post{
    background:#222;
    padding:10px;
    border-radius:10px;
    margin-top:10px;
}

.post img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

#app{display:none;}

</style>
</head>

<body>

<div class="container">

<div class="card" id="auth">

<h2>Mini Instagram</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<div id="app">

<div class="card">

<h3 id="userEmail"></h3>

<input type="file" id="image">
<textarea id="text" placeholder="Write post..."></textarea>

<button onclick="createPost()">Post</button>
<button onclick="logout()">Logout</button>

</div>

<div id="posts"></div>

</div>

</div>

<script type="module">

import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(
'https://opqngkyrgazoggzscdqv.supabase.co',
'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9wcW5na3lyZ2F6b2dnenNjZHF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTE2NjUsImV4cCI6MjA5NDQyNzY2NX0.ujjzvuhq1MxpDDLo8g5skjfa_vNunGU5d4EY402x7Fc'
)

let currentUser = null

// REGISTER
window.register = async () => {
const email = emailInput().email
const password = emailInput().password

const { error } = await supabase.auth.signUp({ email, password })

if(error) return alert(error.message)

alert("Registered")
}

// LOGIN
window.login = async () => {
const email = emailInput().email
const password = emailInput().password

const { data, error } =
await supabase.auth.signInWithPassword({ email, password })

if(error) return alert(error.message)

currentUser = data.user.email
showApp()
loadPosts()
}

// LOGOUT
window.logout = async () => {
await supabase.auth.signOut()
location.reload()
}

// CREATE POST (FIXED)
window.createPost = async () => {

try{

const file = document.getElementById("image").files[0]
const text = document.getElementById("text").value

if(!file) return alert("Select image")

const fileName = Date.now() + "_" + file.name

// UPLOAD IMAGE
const { error: uploadError } = await supabase.storage
.from("images")
.upload(fileName, file)

if(uploadError){
alert("Upload error: " + uploadError.message)
return
}

// GET PUBLIC URL
const { data: urlData } = supabase.storage
.from("images")
.getPublicUrl(fileName)

// INSERT POST
const { error } = await supabase.from("posts").insert({
user_email: currentUser,
content: text,
image_url: urlData.publicUrl
})

if(error){
alert("DB error: " + error.message)
return
}

document.getElementById("text").value = ""
loadPosts()

}catch(e){
alert("Fatal error: " + e.message)
}

}

// LOAD POSTS (FIXED)
async function loadPosts(){

const { data, error } = await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false})

if(error){
alert("Load error: " + error.message)
return
}

document.getElementById("posts").innerHTML = ""

data.forEach(post => {

const div = document.createElement("div")
div.className = "post"

div.innerHTML = `
<b>${post.user_email || ""}</b>
<p>${post.content || ""}</p>
<img src="${post.image_url || ""}">
`

document.getElementById("posts").appendChild(div)

})

}

// SHOW APP
function showApp(){
document.getElementById("auth").style.display="none"
document.getElementById("app").style.display="block"
document.getElementById("userEmail").innerText=currentUser
}

// INPUT FIX
function emailInput(){
return {
email: document.getElementById("email").value,
password: document.getElementById("password").value
}
}

// CHECK USER
async function checkUser(){
const { data } = await supabase.auth.getUser()

if(data.user){
currentUser = data.user.email
showApp()
loadPosts()
}
}

checkUser()

</script>

</body>
</html>
