<!DOCTYPE html>
<html lang="ru">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Neo Social</title>

<style>

/* H O U D I N I  S T Y L E */

body{
    margin:0;
    background:#050505;
    color:#fff;
    font-family:Arial;
}

.glass{
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border-radius:16px;
    padding:15px;
    margin:10px;
}

.container{
    width:500px;
    margin:auto;
    padding-top:20px;
}

input, textarea{

    width:100%;
    padding:10px;
    margin-top:8px;

    border:none;
    border-radius:10px;

    background:#111;
    color:white;
}

button{

    width:100%;
    padding:10px;
    margin-top:10px;

    border:none;
    border-radius:10px;

    background:#6c5ce7;
    color:white;
}

.post img{
    width:100%;
    border-radius:12px;
    margin-top:10px;
}

#app{display:none;}

</style>
</head>

<body>

<div class="container">

<!-- AUTH -->
<div class="glass" id="auth">

<h2>NEO SOCIAL</h2>

<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">

<button onclick="register()">Register</button>
<button onclick="login()">Login</button>

</div>

<!-- APP -->
<div id="app">

<div class="glass">

<h3 id="userEmail"></h3>

<input type="file" id="imageInput">

<textarea id="text" placeholder="Write post..."></textarea>

<button onclick="createPost()">Post</button>

</div>

<div id="posts"></div>

</div>

</div>

<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabase = createClient(

'https://opqngkyrgazoggzscdqv.supabase.co',

'PASTE_ANON_KEY_HERE'

)

let userEmail = null

// REGISTER
window.register = async () => {

const email = emailInput().email
const password = emailInput().password

const { error } = await supabase.auth.signUp({
email, password
})

alert(error ? error.message : "Registered")
}

// LOGIN
window.login = async () => {

const email = emailInput().email
const password = emailInput().password

const { data, error } =
await supabase.auth.signInWithPassword({ email, password })

if(error) return alert(error.message)

userEmail = data.user.email
showApp()
loadPosts()
}

// CREATE POST WITH IMAGE
window.createPost = async () => {

const file = document.getElementById("imageInput").files[0]
const text = document.getElementById("text").value

if(!file) return alert("Add image")

const fileName = Date.now()+file.name

await supabase.storage
.from("images")
.upload(fileName, file)

const { data } = supabase.storage
.from("images")
.getPublicUrl(fileName)

await supabase.from("posts").insert({
user_email: userEmail,
content: text,
image_url: data.publicUrl
})

loadPosts()
}

// LOAD POSTS
async function loadPosts(){

const { data } = await supabase
.from("posts")
.select("*")
.order("created_at",{ascending:false})

document.getElementById("posts").innerHTML = ""

data.forEach(p => {

const div = document.createElement("div")
div.className = "glass post"

div.innerHTML = `
<b>${p.user_email}</b>
<p>${p.content}</p>
<img src="${p.image_url}">
`

document.getElementById("posts").appendChild(div)
})

}

// SHOW APP
function showApp(){
document.getElementById("auth").style.display="none"
document.getElementById("app").style.display="block"
document.getElementById("userEmail").innerText=userEmail
}

// SESSION
async function check(){
const { data } = await supabase.auth.getUser()

if(data.user){
userEmail = data.user.email
showApp()
loadPosts()
}
}
check()

function emailInput(){
return {
email: document.getElementById("email").value,
password: document.getElementById("password").value
}
}

</script>

</body>
</html>
