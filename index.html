<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gravigenesis Social</title>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial;
}

.container{
    width:500px;
    margin:auto;
    padding-top:50px;
}

.card{
    background:#1c1c1c;
    padding:20px;
    border-radius:20px;
    margin-bottom:20px;
}

input, textarea{

    width:100%;
    padding:12px;
    margin-top:10px;

    border:none;

    border-radius:10px;

    background:#2a2a2a;

    color:white;

    font-size:16px;

    box-sizing:border-box;
}

textarea{

    min-height:120px;

}

button{

    width:100%;

    padding:12px;

    margin-top:10px;

    border:none;

    border-radius:10px;

    background:#4b7cff;

    color:white;

    font-size:16px;

    cursor:pointer;
}

.post{

    background:#222;

    padding:15px;

    border-radius:15px;

    margin-top:10px;
}

#app{
    display:none;
}

</style>

</head>

<body>

<div class="container">

<div class="card" id="auth">

<h1>Gravigenesis Social</h1>

<input
type="email"
id="email"
placeholder="Email"
>

<input
type="password"
id="password"
placeholder="Password"
>

<button onclick="register()">
Register
</button>

<button onclick="login()">
Login
</button>

</div>

<div id="app">

<div class="card">

<h2 id="userEmail"></h2>

<button onclick="logout()">
Logout
</button>

</div>

<div class="card">

<h2>Create Post</h2>

<textarea
id="postInput"
placeholder="Write something..."
></textarea>

<button onclick="createPost()">
Publish
</button>

</div>

<div class="card">

<h2>Posts</h2>

<div id="posts"></div>

</div>

</div>

</div>

<script type="module">

import { createClient }

from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

const supabaseUrl =
'https://opqngkyrgazoggzscdqv.supabase.co'

const supabaseKey =
'sb_publishable_Wtexjq6MbpczgnJ5-k69iQ_uusWcuhV'

const supabase =
createClient(
    supabaseUrl,
    supabaseKey
)

window.register = async function(){

    const email =
    document.getElementById('email').value

    const password =
    document.getElementById('password').value

    const { error } =
    await supabase.auth.signUp({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        alert('Registration successful')

    }

}

window.login = async function(){

    const email =
    document.getElementById('email').value

    const password =
    document.getElementById('password').value

    const { data, error } =
    await supabase.auth.signInWithPassword({

        email,
        password

    })

    if(error){

        alert(error.message)

    }else{

        showApp(data.user)

    }

}

window.logout = async function(){

    await supabase.auth.signOut()

    document.getElementById('auth').style.display =
    'block'

    document.getElementById('app').style.display =
    'none'

}

function showApp(user){

    document.getElementById('auth').style.display =
    'none'

    document.getElementById('app').style.display =
    'block'

    document.getElementById('userEmail').innerText =
    user.email

}

window.createPost = function(){

    const text =
    document.getElementById('postInput').value

    if(text.trim() === '') return

    const div =
    document.createElement('div')

    div.className = 'post'

    div.innerText = text

    document.getElementById('posts')
    .prepend(div)

    document.getElementById('postInput').value = ''

}

async function checkUser(){

    const {
        data: { session }
    } = await supabase.auth.getSession()

    if(session){

        showApp(session.user)

    }

}

checkUser()

</script>

</body>
</html>
